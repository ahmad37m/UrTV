
name: Build UrTV Home

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "src/**"
      - "dist/**"
      - "assets/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build web assets
        run: python src/build.py

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Build APK
        run: gradle -p android :launcher:assembleDebug

      - name: Find generated APK
        run: |
          echo "Searching for APK files..."
          find android -type f -name "*.apk" -print
          test -n "$(find android -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: urtv-home-android7-test
          path: android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
